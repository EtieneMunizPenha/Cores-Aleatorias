<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Gerador de Cores Aleatórias</title>
  </head>
  <body>
    <main class="container">
      <h1 class="text">Clique no botão abaixo para mudar a cor!</h1>
      <div class="wrapper">
        <div class="splash">
          <svg
            id="splash-box"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 480 480"
          >
            <path
              d="M450 210a57 57 0 0 1-40.3-97.3 30 30 0 1 0-42.4-42.4A57 57 0 0 1 270 30a30 30 0 1 0-60 0 57 57 0 0 1-97.3 40.3 30 30 0 1 0-42.4 42.4A57 57 0 0 1 30 210a30 30 0 1 0 0 60 57 57 0 0 1 40.3 97.3 30 30 0 1 0 42.4 42.4A57 57 0 0 1 210 450a30 30 0 1 0 60 0 57 57 0 0 1 97.3-40.3 30 30 0 1 0 42.4-42.4A57 57 0 0 1 450 270a30 30 0 1 0 0-60Z"
              fill="#FF0000"
            ></path>
          </svg>
        </div>
        <div id="splash-hexa-box" class="splash-hexa">#FF0000</div>
        <button id="btn">Mudar a cor</button>
      </div>
      <footer>
        <p class="footer">By Etiene Muniz Penha</p>
      </footer>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
